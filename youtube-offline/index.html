<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiTube · vídeos sin conexión</title>
  <style>
    /* ---------- Colores y medidas básicas ---------- */
    :root {
      --fondo: #0f0f0f;
      --fondo-2: #1f1f1f;
      --fondo-3: #272727;
      --borde: #3f3f3f;
      --texto: #f1f1f1;
      --texto-2: #aaaaaa;
      --acento: #ff0033;
      --radio: 12px;
      --alto-cabecera: 56px;
      --ancho-lateral: 240px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Roboto, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background: var(--fondo);
      color: var(--texto);
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; cursor: pointer; }

    /* ---------- Cabecera ---------- */
    header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--alto-cabecera);
      display: flex; align-items: center; gap: 16px;
      padding: 0 16px;
      background: var(--fondo);
      z-index: 10;
    }
    .logo {
      display: flex; align-items: center; gap: 6px;
      font-weight: 700; font-size: 1.15rem; letter-spacing: -0.5px;
      white-space: nowrap;
    }
    .logo .icono {
      width: 30px; height: 21px; border-radius: 6px;
      background: var(--acento);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .logo .icono::after {
      content: ""; border-left: 9px solid #fff;
      border-top: 5.5px solid transparent; border-bottom: 5.5px solid transparent;
      margin-left: 2px;
    }
    .logo small { color: var(--texto-2); font-weight: 400; font-size: 0.75rem; margin-left: 4px; }

    .buscador {
      flex: 1; max-width: 640px; margin: 0 auto;
      display: flex;
    }
    .buscador input {
      flex: 1; height: 40px;
      padding: 0 16px;
      border: 1px solid var(--borde); border-right: 0;
      border-radius: 20px 0 0 20px;
      background: #121212; color: var(--texto);
      font-size: 1rem; outline: none;
    }
    .buscador input:focus { border-color: #1c62b9; }
    .buscador button {
      width: 64px; height: 40px;
      border: 1px solid var(--borde); border-radius: 0 20px 20px 0;
      background: var(--fondo-3);
    }
    .estado { color: var(--texto-2); font-size: 0.8rem; white-space: nowrap; }
    .boton-menu {
      display: none; width: 40px; height: 40px; border: 0; background: none;
      border-radius: 50%; font-size: 1.3rem;
    }
    .boton-menu:hover { background: var(--fondo-3); }

    /* ---------- Barra lateral ---------- */
    nav {
      position: fixed; top: var(--alto-cabecera); bottom: 0; left: 0;
      width: var(--ancho-lateral);
      padding: 12px;
      overflow-y: auto;
      background: var(--fondo);
    }
    nav h3 {
      margin: 16px 12px 8px; font-size: 0.95rem; color: var(--texto); font-weight: 600;
    }
    .item {
      display: flex; align-items: center; gap: 16px;
      width: 100%; padding: 10px 12px;
      border: 0; border-radius: 10px;
      background: none; text-align: left; font-size: 0.9rem;
    }
    .item:hover { background: var(--fondo-3); }
    .item.activo { background: var(--fondo-3); font-weight: 600; }
    .item .ico { width: 24px; text-align: center; font-size: 1.1rem; }
    .item .avatar {
      width: 24px; height: 24px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .item .nombre { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .contador { color: var(--texto-2); font-size: 0.8rem; }
    nav hr { border: 0; border-top: 1px solid var(--borde); margin: 12px 0; }

    /* ---------- Zona principal ---------- */
    main {
      margin-left: var(--ancho-lateral);
      padding: calc(var(--alto-cabecera) + 16px) 24px 40px;
      min-height: 100vh;
    }

    .filtros {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px;
    }
    .chip {
      padding: 6px 12px; border: 0; border-radius: 8px;
      background: var(--fondo-3); font-size: 0.85rem;
    }
    .chip.activo { background: var(--texto); color: var(--fondo); }

    /* Rejilla de vídeos */
    .rejilla {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 32px 16px;
    }
    .tarjeta { cursor: pointer; }
    .miniatura {
      position: relative; aspect-ratio: 16 / 9;
      border-radius: var(--radio); overflow: hidden;
      background: var(--fondo-2);
    }
    .miniatura img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .miniatura .duracion {
      position: absolute; right: 8px; bottom: 8px;
      padding: 2px 5px; border-radius: 4px;
      background: rgba(0,0,0,0.8); font-size: 0.75rem; font-weight: 600;
    }
    .miniatura .progreso {
      position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
      background: rgba(255,255,255,0.3);
    }
    .miniatura .progreso span { display: block; height: 100%; background: var(--acento); }
    .tarjeta .sin-imagen {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      color: var(--texto-2); font-size: 2.5rem;
    }
    .datos { display: flex; gap: 12px; margin-top: 12px; }
    .datos .avatar {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff;
    }
    .datos h2 {
      margin: 0 0 4px; font-size: 1rem; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .datos p { margin: 0; color: var(--texto-2); font-size: 0.85rem; }

    /* ---------- Reproductor ---------- */
    .reproductor {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 400px;
      gap: 24px;
    }
    video {
      width: 100%; aspect-ratio: 16 / 9;
      border-radius: var(--radio); background: #000;
      outline: none;
    }
    .reproductor h1 { font-size: 1.25rem; margin: 12px 0 8px; line-height: 1.4; }
    .fila-canal { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .fila-canal .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff;
    }
    .fila-canal .nombre-canal { font-weight: 600; }
    .fila-canal .sub { color: var(--texto-2); font-size: 0.8rem; }
    .fila-canal .acciones { margin-left: auto; display: flex; gap: 8px; }
    .pildora {
      padding: 8px 14px; border: 0; border-radius: 18px;
      background: var(--fondo-3); font-size: 0.85rem; font-weight: 600;
    }
    .pildora:hover { background: var(--borde); }
    .descripcion {
      background: var(--fondo-3); border-radius: var(--radio);
      padding: 12px; font-size: 0.9rem; white-space: pre-wrap; word-break: break-word;
      max-height: 120px; overflow: hidden; position: relative; cursor: pointer;
    }
    .descripcion.abierta { max-height: none; }
    .descripcion .meta { font-weight: 600; margin-bottom: 8px; }
    .descripcion .mas {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 24px 12px 10px;
      background: linear-gradient(transparent, var(--fondo-3) 60%); font-weight: 600;
    }
    .descripcion.abierta .mas { display: none; }
    .lista-lateral h3 { margin: 0 0 12px; font-size: 1rem; }
    .mini {
      display: flex; gap: 8px; margin-bottom: 8px; padding: 4px; border-radius: 8px; cursor: pointer;
    }
    .mini:hover, .mini.activo { background: var(--fondo-3); }
    .mini .miniatura { width: 168px; flex-shrink: 0; border-radius: 8px; }
    .mini h4 {
      margin: 0 0 4px; font-size: 0.875rem; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .mini p { margin: 0; color: var(--texto-2); font-size: 0.75rem; }

    /* ---------- Pantalla vacía ---------- */
    .vacio {
      max-width: 640px; margin: 60px auto; text-align: center; color: var(--texto-2); line-height: 1.6;
    }
    .vacio h2 { color: var(--texto); }
    .vacio code {
      display: block; text-align: left; background: var(--fondo-3); border-radius: 8px;
      padding: 12px 16px; margin: 12px 0; color: var(--texto); font-size: 0.9rem; overflow-x: auto;
    }
    .atajos { color: var(--texto-2); font-size: 0.8rem; margin-top: 16px; }
    kbd {
      background: var(--fondo-3); border: 1px solid var(--borde); border-radius: 4px;
      padding: 1px 6px; font-family: inherit; font-size: 0.75rem;
    }

    /* ---------- Pantallas pequeñas ---------- */
    @media (max-width: 1000px) {
      .reproductor { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      .boton-menu { display: block; }
      nav { transform: translateX(-100%); transition: transform 0.2s; z-index: 9; }
      nav.abierta { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,0.5); }
      main { margin-left: 0; padding: calc(var(--alto-cabecera) + 12px) 12px 32px; }
      .estado { display: none; }
      .rejilla { grid-template-columns: 1fr; gap: 24px; }
      .logo small { display: none; }
    }
  </style>
</head>
<body>

  <!-- Cabecera: logo, buscador y estado de la última actualización -->
  <header>
    <button class="boton-menu" id="boton-menu" aria-label="Menú">☰</button>
    <a class="logo" href="#" id="logo">
      <span class="icono"></span>MiTube<small>sin conexión</small>
    </a>
    <form class="buscador" id="buscador" role="search">
      <input type="search" id="busqueda" placeholder="Buscar en tus vídeos descargados" autocomplete="off">
      <button type="submit" aria-label="Buscar">🔍</button>
    </form>
    <span class="estado" id="estado"></span>
  </header>

  <!-- Barra lateral: secciones y canales -->
  <nav id="lateral"></nav>

  <!-- Contenido: rejilla de vídeos o reproductor -->
  <main id="contenido"></main>

  <!-- La biblioteca la genera actualizar.py. Si no existe, se muestra una ayuda. -->
  <script src="biblioteca.js"></script>
  <script>
    // ============================================================
    //  Datos
    // ============================================================
    const BIB = window.BIBLIOTECA || { actualizado: "", total: 0, canales: [], videos: [] };
    const VIDEOS = BIB.videos || [];
    const CANALES = BIB.canales || [];
    const CLAVE_PROGRESO = "mitube-progreso";   // dónde se guarda por dónde ibas en cada vídeo
    const CLAVE_HISTORIAL = "mitube-historial"; // vídeos vistos recientemente

    // Estado de la pantalla (qué se está mostrando)
    const estado = { vista: "inicio", canal: null, busqueda: "", video: null, orden: "recientes" };

    // ============================================================
    //  Utilidades
    // ============================================================
    function leerLocal(clave, valorPorDefecto) {
      try { return JSON.parse(localStorage.getItem(clave)) || valorPorDefecto; }
      catch (e) { return valorPorDefecto; }
    }
    function guardarLocal(clave, valor) {
      try { localStorage.setItem(clave, JSON.stringify(valor)); } catch (e) { /* sin almacenamiento */ }
    }
    function progresoDe(id) { return leerLocal(CLAVE_PROGRESO, {})[id] || null; }
    function guardarProgreso(id, segundos, duracion) {
      const todo = leerLocal(CLAVE_PROGRESO, {});
      todo[id] = { t: Math.floor(segundos), d: Math.floor(duracion || 0) };
      guardarLocal(CLAVE_PROGRESO, todo);
    }
    function anotarHistorial(id) {
      const h = leerLocal(CLAVE_HISTORIAL, []).filter(x => x !== id);
      h.unshift(id);
      guardarLocal(CLAVE_HISTORIAL, h.slice(0, 200));
    }

    function formatoDuracion(seg) {
      seg = Math.max(0, Math.floor(seg || 0));
      const h = Math.floor(seg / 3600), m = Math.floor((seg % 3600) / 60), s = seg % 60;
      const mm = h ? String(m).padStart(2, "0") : m;
      return (h ? h + ":" : "") + mm + ":" + String(s).padStart(2, "0");
    }
    function formatoNumero(n) {
      if (n == null) return "";
      if (n >= 1e6) return (n / 1e6).toFixed(1).replace(".0", "") + " M";
      if (n >= 1e3) return (n / 1e3).toFixed(1).replace(".0", "") + " mil";
      return String(n);
    }
    function haceCuanto(fechaTexto) {
      if (!fechaTexto) return "";
      const fecha = new Date(fechaTexto.replace(" ", "T"));
      const dias = Math.floor((Date.now() - fecha.getTime()) / 86400000);
      if (isNaN(dias)) return fechaTexto;
      if (dias <= 0) return "hoy";
      if (dias === 1) return "hace 1 día";
      if (dias < 7) return `hace ${dias} días`;
      if (dias < 30) return `hace ${Math.floor(dias / 7)} semana${dias >= 14 ? "s" : ""}`;
      if (dias < 365) return `hace ${Math.floor(dias / 30)} mes${dias >= 60 ? "es" : ""}`;
      const anios = Math.floor(dias / 365);
      return `hace ${anios} año${anios > 1 ? "s" : ""}`;
    }
    function colorCanal(nombre) {
      // Un color estable por canal, calculado a partir de su nombre
      let h = 0;
      for (const c of nombre) h = (h * 31 + c.charCodeAt(0)) % 360;
      return `hsl(${h}, 55%, 45%)`;
    }
    function escapar(t) {
      return String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function avatarHtml(nombre, clase) {
      return `<span class="${clase}" style="background:${colorCanal(nombre)}">${escapar(nombre.charAt(0).toUpperCase())}</span>`;
    }
    function miniaturaHtml(v) {
      const p = progresoDe(v.id);
      const barra = p && p.d ? `<div class="progreso"><span style="width:${Math.min(100, p.t / p.d * 100)}%"></span></div>` : "";
      const img = v.miniatura
        ? `<img src="${escapar(v.miniatura)}" alt="" loading="lazy">`
        : `<div class="sin-imagen">▶</div>`;
      return `<div class="miniatura">${img}<span class="duracion">${formatoDuracion(v.duracion)}</span>${barra}</div>`;
    }

    // ============================================================
    //  Qué vídeos se muestran según la vista actual
    // ============================================================
    function videosFiltrados() {
      let lista = VIDEOS.slice();
      if (estado.vista === "canal" && estado.canal) lista = lista.filter(v => v.canal_id === estado.canal);
      if (estado.vista === "historial") {
        const h = leerLocal(CLAVE_HISTORIAL, []);
        lista = h.map(id => VIDEOS.find(v => v.id === id)).filter(Boolean);
        return lista; // el historial ya viene ordenado por último visto
      }
      if (estado.vista === "pendientes") {
        lista = lista.filter(v => { const p = progresoDe(v.id); return !p || !p.d || p.t / p.d < 0.9; });
      }
      if (estado.busqueda) {
        const q = estado.busqueda.toLowerCase();
        lista = lista.filter(v =>
          v.titulo.toLowerCase().includes(q) ||
          v.canal.toLowerCase().includes(q) ||
          (v.descripcion || "").toLowerCase().includes(q));
      }
      if (estado.orden === "recientes") lista.sort((a, b) => (b.fecha + b.descargado).localeCompare(a.fecha + a.descargado));
      if (estado.orden === "antiguos") lista.sort((a, b) => (a.fecha + a.descargado).localeCompare(b.fecha + b.descargado));
      if (estado.orden === "vistas") lista.sort((a, b) => (b.vistas || 0) - (a.vistas || 0));
      if (estado.orden === "duracion") lista.sort((a, b) => b.duracion - a.duracion);
      return lista;
    }

    // ============================================================
    //  Dibujar la barra lateral
    // ============================================================
    function pintarLateral() {
      const lateral = document.getElementById("lateral");
      const activo = (v, c) => estado.vista === v && (c === undefined || estado.canal === c) ? "activo" : "";
      let html = `
        <button class="item ${activo("inicio")}" data-vista="inicio"><span class="ico">🏠</span><span class="nombre">Inicio</span></button>
        <button class="item ${activo("pendientes")}" data-vista="pendientes"><span class="ico">🕒</span><span class="nombre">Pendientes de ver</span></button>
        <button class="item ${activo("historial")}" data-vista="historial"><span class="ico">📜</span><span class="nombre">Historial</span></button>
        <hr>
        <h3>Canales</h3>`;
      if (!CANALES.length) html += `<p class="item" style="color:var(--texto-2)">Aún no hay canales descargados</p>`;
      for (const c of CANALES) {
        html += `<button class="item ${activo("canal", c.id)}" data-vista="canal" data-canal="${escapar(c.id)}">
          ${avatarHtml(c.nombre, "avatar")}<span class="nombre">${escapar(c.nombre)}</span><span class="contador">${c.videos}</span></button>`;
      }
      html += `<hr><p class="atajos" style="padding:0 12px">Atajos: <kbd>K</kbd> pausa · <kbd>J</kbd>/<kbd>L</kbd> ±10 s · <kbd>F</kbd> pantalla completa · <kbd>N</kbd> siguiente · <kbd>Esc</kbd> volver</p>`;
      lateral.innerHTML = html;
      lateral.querySelectorAll("button.item").forEach(b => b.addEventListener("click", () => {
        estado.vista = b.dataset.vista;
        estado.canal = b.dataset.canal || null;
        estado.video = null;
        estado.busqueda = "";
        document.getElementById("busqueda").value = "";
        lateral.classList.remove("abierta");
        navegar();
      }));
    }

    // ============================================================
    //  Dibujar la rejilla de vídeos
    // ============================================================
    function pintarRejilla() {
      const contenido = document.getElementById("contenido");
      if (!VIDEOS.length) {
        contenido.innerHTML = `
          <div class="vacio">
            <h2>Todavía no hay vídeos descargados</h2>
            <p>Esta página reproduce los vídeos que <strong>actualizar.py</strong> descarga a la carpeta <strong>videos/</strong>. Para empezar:</p>
            <code>1. Abre canales.txt y escribe los canales que quieres seguir.<br>
2. Ejecuta en una terminal, dentro de esta carpeta:<br>
&nbsp;&nbsp;&nbsp;python3 actualizar.py<br>
3. Vuelve a cargar esta página (F5).</code>
            <p>Para que se actualice sola cada día, usa <strong>programar_diario.sh</strong> (Linux/Mac) o <strong>programar_diario.bat</strong> (Windows), o deja abierto <strong>python3 actualizar.py --cada-dia</strong>.</p>
          </div>`;
        return;
      }

      const lista = videosFiltrados();
      let titulo = "";
      if (estado.vista === "canal") titulo = (CANALES.find(c => c.id === estado.canal) || {}).nombre || "Canal";
      if (estado.vista === "historial") titulo = "Historial";
      if (estado.vista === "pendientes") titulo = "Pendientes de ver";
      if (estado.busqueda) titulo = `Resultados para “${estado.busqueda}”`;

      const ordenes = [["recientes", "Más recientes"], ["antiguos", "Más antiguos"], ["vistas", "Más vistos"], ["duracion", "Más largos"]];
      let html = titulo ? `<h1 style="font-size:1.4rem;margin:0 0 16px">${escapar(titulo)}</h1>` : "";
      if (estado.vista !== "historial") {
        html += `<div class="filtros">${ordenes.map(([k, n]) => `<button class="chip ${estado.orden === k ? "activo" : ""}" data-orden="${k}">${n}</button>`).join("")}</div>`;
      }
      if (!lista.length) {
        html += `<div class="vacio"><h2>No hay vídeos aquí</h2><p>Prueba con otra búsqueda o canal.</p></div>`;
      } else {
        html += `<div class="rejilla">` + lista.map(v => `
          <article class="tarjeta" data-id="${escapar(v.id)}">
            ${miniaturaHtml(v)}
            <div class="datos">
              ${avatarHtml(v.canal, "avatar")}
              <div>
                <h2>${escapar(v.titulo)}</h2>
                <p>${escapar(v.canal)}</p>
                <p>${v.vistas != null ? formatoNumero(v.vistas) + " visualizaciones · " : ""}${haceCuanto(v.fecha)}</p>
              </div>
            </div>
          </article>`).join("") + `</div>`;
      }
      contenido.innerHTML = html;
      contenido.querySelectorAll(".tarjeta").forEach(t => t.addEventListener("click", () => abrirVideo(t.dataset.id)));
      contenido.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { estado.orden = c.dataset.orden; pintarRejilla(); }));
      window.scrollTo(0, 0);
    }

    // ============================================================
    //  Dibujar el reproductor
    // ============================================================
    function pintarReproductor() {
      const v = VIDEOS.find(x => x.id === estado.video);
      if (!v) { estado.vista = "inicio"; estado.video = null; navegar(); return; }
      anotarHistorial(v.id);

      // "A continuación": el resto del mismo canal primero y luego los demás
      const mismos = VIDEOS.filter(x => x.id !== v.id && x.canal_id === v.canal_id);
      const otros = VIDEOS.filter(x => x.id !== v.id && x.canal_id !== v.canal_id);
      const siguientes = mismos.concat(otros).slice(0, 30);

      const canal = CANALES.find(c => c.id === v.canal_id) || { videos: 0 };
      const p = progresoDe(v.id);
      const contenido = document.getElementById("contenido");
      contenido.innerHTML = `
        <div class="reproductor">
          <div>
            <video id="video" src="${escapar(v.archivo)}" controls autoplay playsinline ${v.miniatura ? `poster="${escapar(v.miniatura)}"` : ""}></video>
            <h1>${escapar(v.titulo)}</h1>
            <div class="fila-canal">
              ${avatarHtml(v.canal, "avatar")}
              <div>
                <div class="nombre-canal">${escapar(v.canal)}</div>
                <div class="sub">${canal.videos} vídeo${canal.videos === 1 ? "" : "s"} descargados</div>
              </div>
              <div class="acciones">
                <button class="pildora" id="ver-canal">Ver canal</button>
                <button class="pildora" id="siguiente">Siguiente ▸</button>
                ${v.url_original ? `<a class="pildora" href="${escapar(v.url_original)}" target="_blank" rel="noopener" title="Solo funciona con conexión">Abrir en YouTube ↗</a>` : ""}
              </div>
            </div>
            <div class="descripcion" id="descripcion">
              <div class="meta">${v.vistas != null ? formatoNumero(v.vistas) + " visualizaciones · " : ""}${v.fecha ? v.fecha + " · " : ""}${haceCuanto(v.fecha)}${v.megusta != null ? " · 👍 " + formatoNumero(v.megusta) : ""}</div>${escapar(v.descripcion || "Sin descripción.")}
              <div class="mas">…más</div>
            </div>
          </div>
          <aside class="lista-lateral">
            <h3>A continuación</h3>
            ${siguientes.map(s => `
              <div class="mini" data-id="${escapar(s.id)}">
                ${miniaturaHtml(s)}
                <div><h4>${escapar(s.titulo)}</h4><p>${escapar(s.canal)}</p><p>${haceCuanto(s.fecha)}</p></div>
              </div>`).join("")}
          </aside>
        </div>`;

      const video = document.getElementById("video");
      // Reanudar por donde ibas (si no estaba casi terminado)
      if (p && p.d && p.t > 5 && p.t / p.d < 0.95) video.currentTime = p.t;
      let ultimoGuardado = 0, terminado = false;
      // Si el elemento ya no está en la página (cambiamos de vídeo), sus eventos tardíos se ignoran
      const guardar = (segundos) => { if (video.isConnected && !terminado) guardarProgreso(v.id, segundos, video.duration); };
      video.addEventListener("timeupdate", () => {
        if (Date.now() - ultimoGuardado > 3000) { guardar(video.currentTime); ultimoGuardado = Date.now(); }
      });
      video.addEventListener("pause", () => guardar(video.currentTime));
      video.addEventListener("ended", () => {
        guardar(video.duration);
        terminado = true;
        if (siguientes[0]) abrirVideo(siguientes[0].id);   // reproducción automática del siguiente
      });
      video.addEventListener("error", () => {
        const aviso = document.createElement("p");
        aviso.style.color = "var(--texto-2)";
        aviso.textContent = "No se pudo reproducir el archivo " + v.archivo + ". Puede que se haya borrado o que el navegador no admita su formato.";
        video.after(aviso);
      });

      document.getElementById("ver-canal").addEventListener("click", () => {
        estado.vista = "canal"; estado.canal = v.canal_id; estado.video = null; navegar();
      });
      document.getElementById("siguiente").addEventListener("click", () => { if (siguientes[0]) abrirVideo(siguientes[0].id); });
      document.getElementById("descripcion").addEventListener("click", e => e.currentTarget.classList.toggle("abierta"));
      contenido.querySelectorAll(".mini").forEach(m => m.addEventListener("click", () => abrirVideo(m.dataset.id)));
      window.scrollTo(0, 0);
    }

    // ============================================================
    //  Navegación (la dirección de la página guarda qué se ve)
    // ============================================================
    function abrirVideo(id) {
      estado.video = id;
      location.hash = "v=" + encodeURIComponent(id);
    }
    function navegar() {
      // Reflejar el estado en la dirección para poder recargar o volver atrás
      let hash = "";
      if (estado.video) hash = "v=" + encodeURIComponent(estado.video);
      else if (estado.vista === "canal" && estado.canal) hash = "canal=" + encodeURIComponent(estado.canal);
      else if (estado.vista !== "inicio") hash = estado.vista;
      if (location.hash.slice(1) !== hash) { location.hash = hash; return; } // el evento hashchange llamará a pintar()
      pintar();
    }
    function leerHash() {
      const h = decodeURIComponent(location.hash.slice(1));
      estado.video = null;
      if (h.startsWith("v=")) estado.video = h.slice(2);
      else if (h.startsWith("canal=")) { estado.vista = "canal"; estado.canal = h.slice(6); }
      else if (h === "historial" || h === "pendientes") estado.vista = h;
      else if (h === "") { estado.vista = "inicio"; estado.canal = null; }
    }
    function pintar() {
      pintarLateral();
      if (estado.video) pintarReproductor(); else pintarRejilla();
    }
    window.addEventListener("hashchange", () => { leerHash(); pintar(); });

    // ============================================================
    //  Buscador, menú y teclado
    // ============================================================
    document.getElementById("buscador").addEventListener("submit", e => {
      e.preventDefault();
      estado.busqueda = document.getElementById("busqueda").value.trim();
      estado.video = null;
      if (location.hash && location.hash !== "#") location.hash = ""; else pintar();
    });
    document.getElementById("busqueda").addEventListener("input", e => {
      if (!estado.video) { estado.busqueda = e.target.value.trim(); pintarRejilla(); }
    });
    document.getElementById("logo").addEventListener("click", e => {
      e.preventDefault();
      estado.vista = "inicio"; estado.canal = null; estado.video = null; estado.busqueda = "";
      document.getElementById("busqueda").value = "";
      navegar();
    });
    document.getElementById("boton-menu").addEventListener("click", () => document.getElementById("lateral").classList.toggle("abierta"));

    document.addEventListener("keydown", e => {
      if (e.target.tagName === "INPUT") { if (e.key === "Escape") e.target.blur(); return; }
      const video = document.getElementById("video");
      if (e.key === "Escape") { if (estado.video) { estado.video = null; navegar(); } return; }
      if (e.key === "/") { e.preventDefault(); document.getElementById("busqueda").focus(); return; }
      if (!video) return;
      switch (e.key.toLowerCase()) {
        case "k": case " ": e.preventDefault(); video.paused ? video.play() : video.pause(); break;
        case "j": case "arrowleft": video.currentTime = Math.max(0, video.currentTime - 10); break;
        case "l": case "arrowright": video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); break;
        case "f": document.fullscreenElement ? document.exitFullscreen() : video.requestFullscreen?.(); break;
        case "m": video.muted = !video.muted; break;
        case "n": document.getElementById("siguiente")?.click(); break;
        case "arrowup": e.preventDefault(); video.volume = Math.min(1, video.volume + 0.1); break;
        case "arrowdown": e.preventDefault(); video.volume = Math.max(0, video.volume - 0.1); break;
      }
    });

    // ============================================================
    //  Arranque
    // ============================================================
    document.getElementById("estado").textContent = BIB.actualizado
      ? `${BIB.total} vídeos · actualizado ${haceCuanto(BIB.actualizado)} (${BIB.actualizado})`
      : "Sin biblioteca: ejecuta actualizar.py";
    leerHash();
    pintar();
  </script>
</body>
</html>
